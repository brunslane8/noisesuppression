name: Build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build app
        run: cargo build --release

      - name: Check the VB-CABLE download the installer uses
        shell: pwsh
        run: |
          foreach ($v in 45, 43) {
            $url = "https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack$v.zip"
            try {
              Invoke-WebRequest $url -OutFile cable.zip -UserAgent "Mozilla/5.0"
              Expand-Archive cable.zip -DestinationPath cable -Force
              if (Test-Path cable/VBCABLE_Setup_x64.exe) { Write-Host "OK: $url"; exit 0 }
              Write-Host "::warning::$url has no VBCABLE_Setup_x64.exe"; Get-ChildItem cable
            } catch { Write-Host "::warning::$url failed: $_" }
          }
          Write-Host "::error::No working VB-CABLE download found"; exit 1

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" | Select-Object -First 1
          }
          & $iscc.FullName "/DAppVersion=$version" installer\hush.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: Hush
          path: |
            dist/Hush-Setup.exe
            target/release/hush.exe

      # Runs on a v* tag, or when started by hand with "Run workflow" (it then creates the tag).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Hush ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/Hush-Setup.exe
            target/release/hush.exe
          body: |
            ## Install
            1. Download **Hush-Setup.exe** below and run it.
            2. If Windows says "Windows protected your PC", click **More info → Run anyway** (the app isn't code-signed yet).
            3. When Windows asks to install the audio driver, click **Install**. Restart if asked.

            That's it. Hush starts with Windows and every app (Discord, Zoom, browsers, games) automatically uses your cleaned-up mic.

            `hush.exe` is the portable version for people who already have VB-CABLE installed.
