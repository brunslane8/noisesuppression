[package]
name = "hush"
version = "0.1.1"
edition = "2021"
description = "Tiny noise suppressor for your microphone"
license = "MIT"

[dependencies]
sonora = "0.2"
nnnoiseless = { version = "0.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
cpal = "0.18"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
ringbuf = "0.5"
winreg = "0.56"
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Media_Audio", "Win32_System_Threading", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
